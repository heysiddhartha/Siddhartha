name: Refresh Radar Feed
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh opportunity database
        run: python scripts/refresh.py
      - name: Commit refreshed database
        run: |
          git config user.name "Radar Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunities.json feed.xml
          git diff --cached --quiet || git commit -m "Refresh RADAR opportunity database"
          git push